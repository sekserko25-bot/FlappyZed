<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZED'S REVENGE - Prologue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MATRIX INTRO -->
    <div id="matrixIntro">
        <canvas id="matrixCanvas"></canvas>
        <div class="intro-content">
            <div class="intro-line">YEAR 3101</div>
            <div class="intro-line">PLANET ZAKARDIA</div>
            <div class="intro-line">CITY OF ZERATH</div>
            <div class="intro-gap"></div>
            <div class="intro-line red">RULED BY ZORAK CREED</div>
            <div class="intro-line red">AND HIS PUPPET KRUMP</div>
            <div class="intro-gap"></div>
            <div class="intro-line">THEY CONTROL THE MARKET</div>
            <div class="intro-line">THE PEOPLE</div>
            <div class="intro-line">THE TRUTH</div>
            <div class="intro-gap"></div>
            <div class="intro-line cyan">ONE MAN WILL RISE</div>
            <div class="intro-line cyan">HIS NAME IS ZED</div>
            <div class="intro-gap"></div>
            <div class="intro-blink">[ TAP OR PRESS ENTER ]</div>
        </div>
    </div>

    <!-- MANGA PAGE -->
    <div class="manga-page-container" id="mangaContainer" style="display:none;">
        <div class="manga-page-scroll" id="mangaScroll">
            <img src="images/story-page.png" alt="Prologue" class="manga-page-image">
        </div>
        
        <div class="scroll-indicator" id="scrollHint">SCROLL TO READ ▼</div>
        <div class="manga-controls-fixed">
            <button id="skipBtn">SKIP ⏩</button>
        </div>
        <div class="manga-progress-bottom">
            <div class="manga-progress-fill" id="progressFill"></div>
        </div>
        <div class="manga-finish" id="finishScreen">
            <div class="finish-content">
                <h2>PROLOGUE COMPLETE</h2>
                <p>Zed is ready to rise.</p>
                <button id="continueBtn">🎮 START CHAPTER 1</button>
            </div>
        </div>
    </div>

    <script>
        // ============ MATRIX INTRO ============
        const mCanvas = document.getElementById('matrixCanvas');
        const mCtx = mCanvas.getContext('2d');
        
        function resizeMatrix() {
            mCanvas.width = window.innerWidth;
            mCanvas.height = window.innerHeight;
        }
        resizeMatrix();
        window.addEventListener('resize', resizeMatrix);

        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ZEDKRUMPZORAKCREED';
        const fontSize = 18;
        let drops = [];
        
        function initDrops() {
            const columns = Math.floor(mCanvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.floor(Math.random() * -50);
            }
        }
        initDrops();

        function drawMatrix() {
            mCtx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
            mCtx.fillStyle = '#00ff41';
            mCtx.font = 'bold ' + fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                mCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > mCanvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        const matrixInterval = setInterval(drawMatrix, 35);

        const intro = document.getElementById('matrixIntro');
        const mangaContainer = document.getElementById('mangaContainer');

        function closeIntro() {
            clearInterval(matrixInterval);
            intro.style.transition = 'opacity 0.8s';
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                mangaContainer.style.display = 'block';
                startManga();
            }, 800);
        }

        intro.addEventListener('click', closeIntro);
        intro.addEventListener('touchstart', (e) => { e.preventDefault(); closeIntro(); }, { passive: false });
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Enter' || e.code === 'Space') {
                e.preventDefault();
                closeIntro();
            }
        });
        setTimeout(closeIntro, 15000);

        // ============ MANGA ============
        let mangaStarted = false;
        function startManga() {
            if (mangaStarted) return;
            mangaStarted = true;
            
            const scroll = document.getElementById('mangaScroll');
            const hint = document.getElementById('scrollHint');
            const progress = document.getElementById('progressFill');
            const finishScreen = document.getElementById('finishScreen');
            let finished = false;

            function updateProgress() {
                const scrollTop = scroll.scrollTop;
                const scrollHeight = scroll.scrollHeight - scroll.clientHeight;
                const pct = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
                progress.style.width = pct + '%';
                
                hint.style.opacity = scrollTop > 100 ? '0' : '1';
                
                if (pct >= 95 && !finished) {
                    finished = true;
                    setTimeout(() => finishScreen.classList.add('visible'), 500);
                }
            }

            scroll.addEventListener('scroll', updateProgress);
            updateProgress();

            function finishStory() {
                localStorage.setItem('zed_story_seen', 'true');
                localStorage.setItem('zakardiya_progress', 1);
                window.location.href = 'game1.html';
            }

            document.getElementById('skipBtn').addEventListener('click', finishStory);
            document.getElementById('continueBtn').addEventListener('click', finishStory);
        }
    </script>
</body>
</html>
