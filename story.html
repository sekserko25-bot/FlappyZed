<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZED'S REVENGE - Prologue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============ MATRIX INTRO ============ -->
    <div id="matrixIntro">
        <canvas id="matrixCanvas"></canvas>
        <div class="intro-content">
            <div class="intro-line">YEAR 3101</div>
            <div class="intro-line">PLANET ZAKARDIA</div>
            <div class="intro-line">CITY OF ZERATH</div>
            <div class="intro-gap"></div>
            <div class="intro-line red">RULED BY ZORAK CREED</div>
            <div class="intro-line red">AND HIS PUPPET KRUMP</div>
            <div class="intro-gap"></div>
            <div class="intro-line">THEY CONTROL THE MARKET</div>
            <div class="intro-line">THE PEOPLE</div>
            <div class="intro-line">THE TRUTH</div>
            <div class="intro-gap"></div>
            <div class="intro-line cyan">ONE MAN WILL RISE</div>
            <div class="intro-line cyan">HIS NAME IS ZED</div>
            <div class="intro-gap"></div>
            <div class="intro-blink">[ PRESS ENTER TO CONTINUE ]</div>
        </div>
    </div>

    <!-- ============ MANGA PAGE ============ -->
    <div class="manga-page-container" id="mangaContainer">
        <div class="manga-page-scroll" id="mangaScroll">
            <img src="images/story-page.png" alt="Zed's Revenge Prologue" class="manga-page-image" id="mangaImage">
            <div class="manga-end-spacer"></div>
        </div>
        
        <div class="scroll-indicator" id="scrollHint">SCROLL TO READ ▼</div>
        
        <div class="manga-controls-fixed">
            <button id="skipBtn">SKIP ⏩</button>
        </div>
        
        <div class="manga-progress-bottom">
            <div class="manga-progress-fill" id="progressFill"></div>
        </div>
        
        <div class="manga-finish" id="finishScreen">
            <div class="finish-content">
                <h2>PROLOGUE COMPLETE</h2>
                <p>Zed is ready to rise.</p>
                <button id="continueBtn">🎮 START CHAPTER 1</button>
            </div>
        </div>
    </div>

    <script>
        // ============ MATRIX INTRO ============
        const matrixCanvas = document.getElementById('matrixCanvas');
        const mCtx = matrixCanvas.getContext('2d');
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;

        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ZEDKRUMPZORAKCREED';
        const fontSize = 16;
        const columns = matrixCanvas.width / fontSize;
        const drops = [];
        for (let i = 0; i < columns; i++) drops[i] = Math.random() * -100;

        function drawMatrix() {
            mCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            mCtx.fillStyle = '#00ff41';
            mCtx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                mCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        const matrixInterval = setInterval(drawMatrix, 40);

        let introClosed = false;
        function closeIntro() {
            if (introClosed) return;
            introClosed = true;
            clearInterval(matrixInterval);
            const intro = document.getElementById('matrixIntro');
            intro.style.opacity = '0';
            setTimeout(() => intro.style.display = 'none', 800);
        }

        document.getElementById('matrixIntro').addEventListener('click', closeIntro);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Enter' || e.code === 'Space') {
                closeIntro();
            }
        });
        // Otomatik 15 saniye sonra kapan
        setTimeout(closeIntro, 15000);

        // ============ MANGA SCROLL ============
        const scroll = document.getElementById('mangaScroll');
        const hint = document.getElementById('scrollHint');
        const progress = document.getElementById('progressFill');
        const finishScreen = document.getElementById('finishScreen');
        let finished = false;

        function updateProgress() {
            const scrollTop = scroll.scrollTop;
            const scrollHeight = scroll.scrollHeight - scroll.clientHeight;
            const pct = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
            progress.style.width = pct + '%';
            
            if (scrollTop > 100) {
                hint.style.opacity = '0';
            } else {
                hint.style.opacity = '1';
            }
            
            if (pct >= 95 && !finished) {
                finished = true;
                setTimeout(() => {
                    finishScreen.classList.add('visible');
                }, 500);
            }
        }

        scroll.addEventListener('scroll', updateProgress);
        updateProgress();

        function finishStory() {
            localStorage.setItem('zed_story_seen', 'true');
            localStorage.setItem('zakardiya_progress', 1);
            window.location.href = 'game1.html';
        }

        document.getElementById('skipBtn').addEventListener('click', finishStory);
        document.getElementById('continueBtn').addEventListener('click', finishStory);

        document.addEventListener('keydown', (e) => {
            if (introClosed) {
                if (e.code === 'ArrowDown' || e.code === 'Space') {
                    e.preventDefault();
                    scroll.scrollBy({ top: 500, behavior: 'smooth' });
                } else if (e.code === 'Escape') {
                    finishStory();
                }
            }
        });
    </script>
</body>
</html>
