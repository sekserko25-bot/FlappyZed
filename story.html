<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZED'S REVENGE - Story</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="manga-container">
        
        <!-- PANEL 1: Eye opening -->
        <div class="manga-panel active" data-panel="1">
            <div class="panel-bg bg-1"></div>
            <div class="halftone"></div>
            <div class="speed-lines-diagonal"></div>
            <svg class="panel-art" viewBox="0 0 400 600">
                <!-- Zed's face close-up -->
                <defs>
                    <radialGradient id="skinGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#f5c99b"/>
                        <stop offset="100%" stop-color="#c99a6b"/>
                    </radialGradient>
                    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#1a1a1a"/>
                        <stop offset="100%" stop-color="#000"/>
                    </linearGradient>
                    <radialGradient id="visorGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ff0000" stop-opacity="1"/>
                        <stop offset="70%" stop-color="#ff0000" stop-opacity="0.3"/>
                        <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
                    </radialGradient>
                </defs>
                
                <!-- Face -->
                <ellipse cx="200" cy="320" rx="120" ry="150" fill="url(#skinGlow)"/>
                
                <!-- Hair -->
                <path d="M 80 280 Q 70 150 130 120 Q 180 100 200 110 Q 220 100 270 120 Q 330 150 320 280 L 310 240 Q 290 200 250 190 L 240 150 L 220 190 Q 200 180 180 190 L 160 150 L 150 190 Q 110 200 90 240 Z" fill="url(#hairGrad)"/>
                
                <!-- Cyan hair streak -->
                <path d="M 130 180 L 115 90 L 150 200 Z" fill="#00ffff"/>
                
                <!-- Eyebrows (angry) -->
                <path d="M 120 290 L 175 300" stroke="#000" stroke-width="8" stroke-linecap="round"/>
                <path d="M 280 290 L 225 300" stroke="#000" stroke-width="8" stroke-linecap="round"/>
                
                <!-- Right eye (anime style - large) -->
                <ellipse cx="250" cy="330" rx="25" ry="30" fill="#fff"/>
                <ellipse cx="255" cy="332" rx="16" ry="20" fill="#1a4a8a"/>
                <ellipse cx="255" cy="332" rx="8" ry="12" fill="#000"/>
                <circle cx="260" cy="325" r="4" fill="#fff" opacity="0.9"/>
                <circle cx="252" cy="338" r="2" fill="#fff" opacity="0.6"/>
                <!-- Eyelashes -->
                <path d="M 225 315 Q 250 305 275 315" stroke="#000" stroke-width="4" fill="none"/>
                
                <!-- Left eye - cyber visor -->
                <rect x="105" y="310" width="80" height="42" rx="8" fill="#1a1a1a"/>
                <rect x="112" y="316" width="66" height="30" rx="5" fill="#ff0000"/>
                <rect x="112" y="316" width="66" height="30" rx="5" fill="url(#visorGlow)"/>
                <circle cx="145" cy="331" r="40" fill="url(#visorGlow)" opacity="0.5"/>
                
                <!-- Nose -->
                <path d="M 200 370 L 195 390 L 205 390" stroke="#c99a6b" stroke-width="3" fill="none"/>
                
                <!-- Mouth (determined) -->
                <path d="M 175 420 L 230 418" stroke="#000" stroke-width="5" stroke-linecap="round"/>
                
                <!-- USB necklace -->
                <path d="M 150 460 Q 200 510 250 460" stroke="#888" stroke-width="2" fill="none"/>
                <rect x="190" y="490" width="20" height="14" rx="2" fill="#8B4513"/>
                <rect x="194" y="493" width="12" height="4" fill="#ffcc00"/>
                
                <!-- Tears glow -->
                <circle cx="260" cy="360" r="3" fill="#00ffff" opacity="0.8"/>
            </svg>
            
            <div class="sfx-text">KRRK...</div>
            <div class="dialogue-box">
                <div class="dialogue-speaker">ZED</div>
                <div class="dialogue-text">07:00. Depth 7. Another day in this hell...</div>
            </div>
            <div class="panel-number">01</div>
        </div>

        <!-- PANEL 2: Screen -->
        <div class="manga-panel" data-panel="2">
            <div class="panel-bg bg-2"></div>
            <div class="halftone red-halftone"></div>
            <svg class="panel-art" viewBox="0 0 400 600">
                <!-- Monitor -->
                <rect x="40" y="80" width="320" height="240" rx="10" fill="#1a1a1a" stroke="#333" stroke-width="3"/>
                <rect x="55" y="95" width="290" height="210" fill="#2a0000"/>
                
                <!-- Crashing chart -->
                <polyline points="70,140 110,160 150,190 190,240 230,270 270,285 330,290" stroke="#ff0000" stroke-width="4" fill="none"/>
                
                <!-- Down arrows -->
                <text x="100" y="180" fill="#ff4444" font-size="24" font-family="Arial" font-weight="bold">↓</text>
                <text x="160" y="220" fill="#ff4444" font-size="24" font-family="Arial" font-weight="bold">↓</text>
                <text x="220" y="260" fill="#ff4444" font-size="24" font-family="Arial" font-weight="bold">↓</text>
                <text x="280" y="285" fill="#ff4444" font-size="24" font-family="Arial" font-weight="bold">↓</text>
                
                <!-- Text on screen -->
                <text x="200" y="130" fill="#ff0000" font-size="14" font-family="Courier New" font-weight="bold" text-anchor="middle">PORTFOLIO</text>
                <text x="200" y="155" fill="#ff6666" font-size="11" font-family="Courier New" text-anchor="middle">-99.7%</text>
                
                <!-- Zed's silhouette watching -->
                <ellipse cx="200" cy="480" rx="60" ry="70" fill="#000" opacity="0.95"/>
                <path d="M 140 440 Q 130 380 160 360 Q 200 340 240 360 Q 270 380 260 440 Z" fill="#000" opacity="0.95"/>
                <!-- Red visor glow on face -->
                <ellipse cx="175" cy="430" rx="30" ry="20" fill="#ff0000" opacity="0.4"/>
            </svg>
            
            <div class="sfx-text red">BEEP</div>
            <div class="dialogue-box">
                <div class="dialogue-speaker">ZED</div>
                <div class="dialogue-text">Everything... gone. In one night.</div>
            </div>
            <div class="panel-number">02</div>
        </div>

        <!-- PANEL 3: Corridor -->
        <div class="manga-panel" data-panel="3">
            <div class="panel-bg bg-3"></div>
            <div class="speed-lines-vertical"></div>
            <svg class="panel-art" viewBox="0 0 400 600">
                <!-- Corridor perspective -->
                <path d="M 0 100 L 400 100 L 300 500 L 100 500 Z" fill="#0a0000" stroke="#3a1a1a" stroke-width="2"/>
                <line x1="0" y1="200" x2="400" y2="200" stroke="#2a1010" stroke-width="2"/>
                <line x1="0" y1="300" x2="400" y2="300" stroke="#2a1010" stroke-width="2"/>
                <line x1="0" y1="400" x2="400" y2="400" stroke="#2a1010" stroke-width="2"/>
                
                <!-- Flickering light -->
                <circle cx="200" cy="80" r="50" fill="#ffcc00" opacity="0.3"/>
                <circle cx="200" cy="80" r="20" fill="#ffdd66" opacity="0.5"/>
                
                <!-- Old neighbor kneeling -->
                <ellipse cx="120" cy="420" rx="35" ry="40" fill="#1a0a0a"/>
                <path d="M 90 400 Q 80 370 100 360 Q 120 355 130 360 Q 145 370 140 400 Z" fill="#1a0a0a"/>
                <!-- Tears -->
                <circle cx="115" cy="385" r="3" fill="#88ccff" opacity="0.9"/>
                <circle cx="125" cy="388" r="2" fill="#88ccff" opacity="0.7"/>
                
                <!-- Zed watching from side -->
                <ellipse cx="330" cy="400" rx="30" ry="40" fill="#000"/>
                <path d="M 300 380 Q 295 340 320 325 Q 340 315 355 325 Q 365 340 360 380 Z" fill="#000"/>
                <!-- Cyan streak -->
                <path d="M 315 340 L 310 290 L 325 345 Z" fill="#00ffff"/>
            </svg>
            
            <div class="dialogue-box">
                <div class="dialogue-speaker">NEIGHBOR</div>
                <div class="dialogue-text">"30 years... all gone..."</div>
            </div>
            <div class="panel-number">03</div>
        </div>

        <!-- PANEL 4: LIQUIDATED -->
        <div class="manga-panel" data-panel="4">
            <div class="panel-bg bg-4"></div>
            <div class="halftone red-halftone"></div>
            <svg class="panel-art" viewBox="0 0 400 600">
                <!-- Big LIQUIDATED text -->
                <text x="200" y="180" fill="#ff0000" font-size="52" font-family="Impact, Arial" font-weight="bold" text-anchor="middle" letter-spacing="2">LIQUIDATED</text>
                <text x="200" y="180" fill="none" stroke="#fff" stroke-width="1" font-size="52" font-family="Impact, Arial" font-weight="bold" text-anchor="middle" letter-spacing="2">LIQUIDATED</text>
                
                <!-- Photo frame -->
                <rect x="120" y="250" width="160" height="200" fill="#333" stroke="#666" stroke-width="3"/>
                <rect x="130" y="260" width="140" height="180" fill="#1a1a1a"/>
                
                <!-- Lira's face -->
                <ellipse cx="200" cy="350" rx="45" ry="55" fill="#f5c99b"/>
                <!-- Hair -->
                <path d="M 155 340 Q 145 280 200 275 Q 255 280 245 340 Q 235 305 200 300 Q 165 305 155 340 Z" fill="#3a1a0a"/>
                <!-- Eyes -->
                <ellipse cx="180" cy="345" rx="8" ry="10" fill="#fff"/>
                <ellipse cx="220" cy="345" rx="8" ry="10" fill="#fff"/>
                <ellipse cx="180" cy="345" rx="4" ry="6" fill="#1a4a8a"/>
                <ellipse cx="220" cy="345" rx="4" ry="6" fill="#1a4a8a"/>
                <circle cx="178" cy="342" r="1.5" fill="#fff"/>
                <circle cx="218" cy="342" r="1.5" fill="#fff"/>
                <!-- Smile -->
                <path d="M 185 375 Q 200 385 215 375" stroke="#000" stroke-width="2" fill="none"/>
                
                <!-- Blood splatter -->
                <circle cx="80" cy="500" r="15" fill="#8b0000" opacity="0.6"/>
                <circle cx="330" cy="480" r="20" fill="#8b0000" opacity="0.5"/>
                <circle cx="60" cy="530" r="8" fill="#8b0000" opacity="0.7"/>
                
                <!-- Fist hitting -->
                <rect x="160" y="520" width="80" height="40" rx="15" fill="#f5c99b"/>
                <path d="M 170 540 L 230 540" stroke="#000" stroke-width="2"/>
                <path d="M 175 530 L 225 530" stroke="#c99a6b" stroke-width="1"/>
            </svg>
            
            <div class="sfx-text blood">CRASH!</div>
            <div class="panel-number">04</div>
        </div>

        <!-- PANEL 5: USB Message -->
        <div class="manga-panel" data-panel="5">
            <div class="panel-bg bg-5"></div>
            <svg class="panel-art" viewBox="0 0 400 600">
                <!-- Holographic glow -->
                <circle cx="200" cy="250" r="180" fill="#00ffff" opacity="0.08"/>
                <circle cx="200" cy="250" r="120" fill="#00ffff" opacity="0.12"/>
                
                <!-- USB necklace (big) -->
                <path d="M 120 100 Q 200 200 280 100" stroke="#888" stroke-width="4" fill="none"/>
                <rect x="170" y="180" width="60" height="40" rx="5" fill="#8B4513"/>
                <rect x="180" y="188" width="40" height="12" fill="#ffcc00"/>
                <rect x="185" y="220" width="30" height="15" fill="#666"/>
                <line x1="190" y1="225" x2="210" y2="225" stroke="#444" stroke-width="2"/>
                <line x1="190" y1="230" x2="210" y2="230" stroke="#444" stroke-width="2"/>
                
                <!-- Holographic lines -->
                <line x1="200" y1="240" x2="200" y2="290" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
                <circle cx="200" cy="290" r="3" fill="#00ffff"/>
                
                <!-- Message text -->
                <text x="200" y="360" fill="#00ffff" font-size="22" font-family="Courier New" text-anchor="middle" font-weight="bold" style="text-shadow: 0 0 15px #00ffff;">"Zed,"</text>
                <text x="200" y="395" fill="#00ffff" font-size="22" font-family="Courier New" text-anchor="middle" font-weight="bold" style="text-shadow: 0 0 15px #00ffff;">"this system must change."</text>
                <text x="200" y="430" fill="#00ffff" font-size="22" font-family="Courier New" text-anchor="middle" font-weight="bold" style="text-shadow: 0 0 15px #00ffff;">"You are strong. Do it."</text>
                
                <!-- Zed silhouette kneeling -->
                <ellipse cx="200" cy="540" rx="35" ry="45" fill="#000"/>
                <path d="M 170 520 Q 165 475 200 465 Q 235 475 230 520 Z" fill="#000"/>
                <!-- Cyan streak -->
                <path d="M 185 490 L 180 440 L 195 495 Z" fill="#00ffff"/>
            </svg>
            
            <div class="dialogue-box glowing">
                <div class="dialogue-speaker">LIRA'S LAST MESSAGE</div>
                <div class="dialogue-text">"Do it for me."</div>
            </div>
            <div class="panel-number">05</div>
        </div>

        <!-- PANEL 6: Rocket Reveal -->
        <div class="manga-panel" data-panel="6">
            <div class="panel-bg bg-6"></div>
            <div class="speed-lines-radial"></div>
            <svg class="panel-art" viewBox="0 0 400 600">
                <!-- Spotlight -->
                <circle cx="200" cy="280" r="180" fill="#ffcc00" opacity="0.15"/>
                <circle cx="200" cy="280" r="100" fill="#ffdd66" opacity="0.2"/>
                
                <!-- Rocket (rotated) -->
                <g transform="translate(200, 280) rotate(-90)">
                    <!-- Body -->
                    <rect x="-80" y="-30" width="150" height="60" rx="10" fill="#4a4a4a"/>
                    <!-- Tip -->
                    <path d="M 70 -30 L 110 0 L 70 30 Z" fill="#8a8a8a"/>
                    <!-- Fins -->
                    <path d="M -70 -30 L -95 -60 L -50 -30 Z" fill="#00ffff"/>
                    <path d="M -70 30 L -95 60 L -50 30 Z" fill="#00ffff"/>
                    <!-- Detail lines -->
                    <line x1="-60" y1="-30" x2="-60" y2="30" stroke="#333" stroke-width="2"/>
                    <line x1="-40" y1="-30" x2="-40" y2="30" stroke="#333" stroke-width="2"/>
                    <line x1="-20" y1="-30" x2="-20" y2="30" stroke="#333" stroke-width="2"/>
                    <!-- Cyan glow -->
                    <circle cx="-95" cy="0" r="20" fill="#00ffff" opacity="0.5"/>
                    <circle cx="-95" cy="0" r="10" fill="#00ffff"/>
                </g>
                
                <!-- VOLKAN-1 text -->
                <text x="200" y="500" fill="#ffcc00" font-size="36" font-family="Impact, Arial" text-anchor="middle" font-weight="bold" letter-spacing="3">VOLKAN-1</text>
                <text x="200" y="535" fill="#ffcc00" font-size="24" font-family="Impact, Arial" text-anchor="middle" font-weight="bold" letter-spacing="5">READY</text>
            </svg>
            
            <div class="sfx-text yellow">WHIRRR</div>
            <div class="panel-number">06</div>
        </div>

        <!-- PANEL 7: Climbing -->
        <div class="manga-panel" data-panel="7">
            <div class="panel-bg bg-7"></div>
            <div class="speed-lines-vertical"></div>
            <svg class="panel-art" viewBox="0 0 400 600">
                <!-- Ladder -->
                <line x1="150" y1="0" x2="150" y2="600" stroke="#666" stroke-width="5"/>
                <line x1="250" y1="0" x2="250" y2="600" stroke="#666" stroke-width="5"/>
                <line x1="150" y1="80" x2="250" y2="80" stroke="#666" stroke-width="4"/>
                <line x1="150" y1="160" x2="250" y2="160" stroke="#666" stroke-width="4"/>
                <line x1="150" y1="240" x2="250" y2="240" stroke="#666" stroke-width="4"/>
                <line x1="150" y1="320" x2="250" y2="320" stroke="#666" stroke-width="4"/>
                <line x1="150" y1="400" x2="250" y2="400" stroke="#666" stroke-width="4"/>
                <line x1="150" y1="480" x2="250" y2="480" stroke="#666" stroke-width="4"/>
                
                <!-- Light at top -->
                <circle cx="200" cy="30" r="100" fill="#88ccff" opacity="0.4"/>
                <circle cx="200" cy="30" r="50" fill="#aaddff" opacity="0.6"/>
                <circle cx="200" cy="30" r="20" fill="#ffffff" opacity="0.9"/>
                
                <!-- Zed climbing -->
                <ellipse cx="200" cy="400" rx="35" ry="45" fill="#000"/>
                <path d="M 170 380 Q 165 335 200 325 Q 235 335 230 380 Z" fill="#000"/>
                <!-- Cyan streak -->
                <path d="M 185 350 L 180 300 L 195 355 Z" fill="#00ffff"/>
                <!-- Red visor -->
                <ellipse cx="180" cy="355" rx="12" ry="6" fill="#ff0000" opacity="0.8"/>
                
                <!-- Pipes on sides -->
                <rect x="20" y="0" width="40" height="600" fill="#3a2a1a" opacity="0.5"/>
                <rect x="340" y="0" width="40" height="600" fill="#3a2a1a" opacity="0.5"/>
            </svg>
            
            <div class="dialogue-box">
                <div class="dialogue-speaker">ZED</div>
                <div class="dialogue-text">Seven levels. Just seven more.</div>
            </div>
            <div class="panel-number">07</div>
        </div>

        <!-- PANEL 8: Flying with drones -->
        <div class="manga-panel" data-panel="8">
            <div class="panel-bg bg-8"></div>
            <div class="speed-lines-diagonal"></div>
            <svg class="panel-art" viewBox="0 0 400 600">
                <!-- Stars -->
                <circle cx="50" cy="50" r="1.5" fill="#fff"/>
                <circle cx="120" cy="30" r="1" fill="#fff"/>
                <circle cx="300" cy="60" r="1.5" fill="#fff"/>
                <circle cx="350" cy="100" r="1" fill="#fff"/>
                <circle cx="80" cy="140" r="1" fill="#fff"/>
                <circle cx="330" cy="180" r="1.5" fill="#fff"/>
                <circle cx="180" cy="80" r="1" fill="#fff"/>
                <circle cx="250" cy="40" r="1" fill="#fff"/>
                
                <!-- City skyline -->
                <rect x="0" y="500" width="50" height="100" fill="#0a0a0a"/>
                <rect x="60" y="470" width="60" height="130" fill="#0a0a0a"/>
                <rect x="130" y="490" width="50" height="110" fill="#0a0a0a"/>
                <rect x="190" y="450" width="70" height="150" fill="#0a0a0a"/>
                <rect x="270" y="480" width="60" height="120" fill="#0a0a0a"/>
                <rect x="340" y="500" width="60" height="100" fill="#0a0a0a"/>
                
                <!-- Neon signs on buildings -->
                <rect x="80" y="490" width="20" height="4" fill="#ff00ff"/>
                <rect x="80" y="500" width="20" height="4" fill="#00ffff"/>
                <rect x="210" y="470" width="30" height="4" fill="#ff0000"/>
                <rect x="210" y="480" width="30" height="4" fill="#00ffff"/>
                <rect x="290" y="500" width="20" height="4" fill="#ffcc00"/>
                
                <!-- Zed flying (with rocket) -->
                <g transform="translate(160, 320) rotate(-15)">
                    <!-- Rocket -->
                    <rect x="-40" y="-12" width="50" height="24" rx="5" fill="#4a4a4a"/>
                    <path d="M -40 -12 L -55 0 L -40 12 Z" fill="#8a8a8a"/>
                    <path d="M -15 -12 L -8 -22 L -12 -12 Z" fill="#00ffff"/>
                    <path d="M -15 12 L -8 22 L -12 12 Z" fill="#00ffff"/>
                    <!-- Flame -->
                    <path d="M -40 -8 L -80 0 L -40 8 Z" fill="#ffcc00" opacity="0.9"/>
                    <path d="M -40 -5 L -65 0 L -40 5 Z" fill="#ff6600" opacity="0.9"/>
                    
                    <!-- Zed body -->
                    <ellipse cx="10" cy="0" rx="18" ry="22" fill="#f5c99b"/>
                    <!-- Hair -->
                    <path d="M -8 -5 Q -12 -22 10 -25 Q 32 -22 28 -5 Q 22 -15 10 -13 Q -2 -15 -8 -5 Z" fill="#000"/>
                    <!-- Cyan streak -->
                    <path d="M -5 -18 L -10 -35 L 0 -20 Z" fill="#00ffff"/>
                    <!-- Visor -->
                    <rect x="-8" y="-3" width="12" height="6" rx="2" fill="#ff0000"/>
                    <!-- Coat -->
                    <rect x="-10" y="10" width="40" height="25" rx="5" fill="#0a0a0a"/>
                    <rect x="-10" y="10" width="4" height="25" fill="#00ffff"/>
                </g>
                
                <!-- Drones -->
                <g transform="translate(320, 200)">
                    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#333"/>
                    <circle cx="-12" cy="0" r="4" fill="#ff0000"/>
                    <circle cx="-12" cy="0" r="8" fill="#ff0000" opacity="0.4"/>
                    <line x1="0" y1="-12" x2="0" y2="-22" stroke="#666" stroke-width="2"/>
                    <circle cx="0" cy="-22" r="6" fill="#888" opacity="0.5"/>
                </g>
                <g transform="translate(360, 280)">
                    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#333"/>
                    <circle cx="-12" cy="0" r="4" fill="#ff0000"/>
                    <circle cx="-12" cy="0" r="8" fill="#ff0000" opacity="0.4"/>
                    <line x1="0" y1="-12" x2="0" y2="-22" stroke="#666" stroke-width="2"/>
                    <circle cx="0" cy="-22" r="6" fill="#888" opacity="0.5"/>
                </g>
                
                <!-- Speech bubble -->
                <path d="M 60 350 Q 40 320 80 310 Q 130 300 140 340 Q 150 380 100 385 Q 90 400 75 395 Q 80 380 60 350 Z" fill="#fff" stroke="#000" stroke-width="2"/>
                <text x="100" y="350" fill="#000" font-size="14" font-family="Arial" font-weight="bold" text-anchor="middle">"This time,</text>
                <text x="100" y="370" fill="#000" font-size="14" font-family="Arial" font-weight="bold" text-anchor="middle">I win."</text>
            </svg>
            
            <div class="sfx-text red">WHOOSH!</div>
            <div class="panel-number">08</div>
        </div>

        <!-- Progress and controls -->
        <div class="manga-progress">
            <div class="manga-progress-bar" id="progressBar"></div>
        </div>
        
        <div class="manga-controls">
            <span class="manga-indicator" id="indicator">1 / 8</span>
            <button id="skipBtn">SKIP ⏩</button>
        </div>

        <div class="manga-tap-hint" id="tapHint">TAP TO CONTINUE ▶</div>
    </div>

    <script>
        let currentPanel = 1;
        const totalPanels = 8;
        let autoTimer;
        const AUTO_DELAY = 5000;

        function showPanel(num) {
            document.querySelectorAll('.manga-panel').forEach(p => p.classList.remove('active'));
            const panel = document.querySelector(`[data-panel="${num}"]`);
            if (panel) {
                panel.classList.add('active');
            }
            document.getElementById('indicator').textContent = `${num} / ${totalPanels}`;
            document.getElementById('progressBar').style.width = (num / totalPanels * 100) + '%';
        }

        function nextPanel() {
            clearTimeout(autoTimer);
            if (currentPanel < totalPanels) {
                currentPanel++;
                showPanel(currentPanel);
                startAutoTimer();
            } else {
                finishStory();
            }
        }

        function startAutoTimer() {
            clearTimeout(autoTimer);
            autoTimer = setTimeout(() => {
                if (currentPanel < totalPanels) {
                    currentPanel++;
                    showPanel(currentPanel);
                    startAutoTimer();
                } else {
                    finishStory();
                }
            }, AUTO_DELAY);
        }

        function finishStory() {
            localStorage.setItem('zakardiya_progress', 1);
            window.location.href = 'game1.html';
        }

        document.querySelector('.manga-container').addEventListener('click', (e) => {
            if (e.target.id === 'skipBtn') return;
            nextPanel();
        });

        document.getElementById('skipBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            finishStory();
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter') {
                e.preventDefault();
                nextPanel();
            }
        });

        // Start
        showPanel(1);
        startAutoTimer();
    </script>
</body>
</html>
