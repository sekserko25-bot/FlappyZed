<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Zed - Zakardiya'nın İntikamı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="start-screen">
            <h1>FLAPPY ZED</h1>
            <p>Zakardiya'nın İntikamı</p>
            <button id="startBtn">OYNA</button>
        </div>
        <div id="game-over-screen" class="hidden">
            <h2>Likit Oldun!</h2>
            <p>Skor: <span id="finalScore">0</span></p>
            <p>Toplanan Coin: <span id="finalCoins">0</span></p>
            <button id="restartBtn">TEKRAR DENE</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
